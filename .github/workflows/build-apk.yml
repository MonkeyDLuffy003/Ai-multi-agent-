name: Build Flutter APK & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 🛠️ Ensure Flutter Project Structure
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "Bootstrapping fresh Flutter project..."
            flutter create --org com.omniroute.ai --project-name omniroute_ai . --platforms=android
          fi

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniRoute-Universal-Release-APK-v1.0.0
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30
